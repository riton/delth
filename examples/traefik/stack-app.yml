# docker stack deploy -c stack-app.yml app --with-registry-auth --prune
version: "3.7"

services:
  backend_without_delth:
    image: 'localhost:5000/delth/sample-app-print-env/without-delth:latest'
    healthcheck:
      test: 'curl -f http://localhost/health'
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - traefik-main
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        failure_action: rollback
        parallelism: 1
        monitor: 10s
        delay: 30s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.network=traefik-main"
        - "traefik.http.routers.nodelth-app.rule=Host(`app-without-delth.127.0.0.1.nip.io`)"
        - "traefik.http.routers.nodelth-app.entrypoints=web"
        - "traefik.http.services.nodelth-app.loadbalancer.server.port=80"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.port=80"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.interval=5s"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.timeout=2s"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.scheme=http"
        - "traefik.http.services.nodelth-app.loadbalancer.healthcheck.status=200"

  backend_with_delth:
    image: 'localhost:5000/delth/sample-app-print-env/with-delth:latest'
    healthcheck:
      test: 'curl -f http://localhost:8069/delth/health?delth.ignoreShuttingDownState=1'
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    environment:
      DELTH_BACKEND_HEALTHCHECK_PORT: 80
      DELTH_BACKEND_HEALTHCHECK_PATH: /health
      DELTH_CMD_EXEC_SHUTDOWN_DELAY: 20s
      DUMMY_APP_VERSION_FOR_HUMAN_TO_SEE: 70
      DELTH_DEBUG: '1'
    networks:
      - traefik-main
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        failure_action: rollback
        parallelism: 1
        monitor: 10s
        delay: 30s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.network=traefik-main"
        - "traefik.http.routers.delth-app.rule=Host(`app-with-delth.127.0.0.1.nip.io`)"
        - "traefik.http.routers.delth-app.entrypoints=web"
        - "traefik.http.services.delth-app.loadbalancer.server.port=80"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.port=8069"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.path=/delth/health"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.interval=5s"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.timeout=2s"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.scheme=http"
        - "traefik.http.services.delth-app.loadbalancer.healthcheck.status=200"

networks:
  traefik-main:
    external: true
